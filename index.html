<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>YüzmeSK</title>
  <meta name="description" content="Havuz kenarı idman programı">
  <meta name="theme-color" content="#0B0F14">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YüzmeSK">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=6">
  <script type="module" src="app.js?v=6"></script>
</head>
<body>

  <!-- Kurulum: Apps Script adresi ve token -->
  <section id="screen-setup" class="screen" hidden>
    <header class="topbar">
      <button class="icon-btn" id="setup-back" aria-label="Geri" hidden>‹</button>
      <h1 class="topbar-title">Kurulum</h1>
    </header>
    <div class="scroll pad">
      <p class="muted">Apps Script web uygulamasının adresini ve gizli anahtarı girin. Bilgiler yalnızca bu cihazda saklanır.</p>
      <label class="field">
        <span>Apps Script adresi</span>
        <input id="setup-url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
      </label>
      <label class="field">
        <span>Gizli anahtar (token)</span>
        <input id="setup-token" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="tokenUret() çıktısı">
      </label>
      <p id="setup-msg" class="msg" hidden></p>
      <button id="setup-save" class="btn btn-primary btn-block">Kaydet ve bağlan</button>
    </div>
  </section>

  <!-- Gün seçimi -->
  <section id="screen-days" class="screen" hidden>
    <header class="topbar">
      <h1 class="topbar-title brand">YüzmeSK</h1>
      <button class="icon-btn" id="days-refresh" aria-label="Yenile">↻</button>
      <button class="icon-btn" id="days-settings" aria-label="Ayarlar">⚙︎</button>
    </header>
    <div class="scroll pad" id="days-scroll">
      <div id="days-banners"></div>
      <div id="days-list"></div>
      <p class="app-version" id="app-version"></p>
    </div>
    <div class="bottom-bar" id="days-today-bar" hidden>
      <button class="btn btn-primary btn-block btn-xl" id="days-today-btn">Bugünün idmanını aç</button>
    </div>
  </section>

  <!-- Program (havuz kenarı): metro hattı -->
  <section id="screen-program" class="screen" hidden>
    <div class="prog-amb" id="prog-amb"></div>
    <header class="prog-head">
      <div class="prog-row">
        <button class="icon-btn" id="prog-back" aria-label="Gün seçimi">‹</button>
        <div class="prog-stat"><span class="lbl">ŞU AN</span><b id="prog-clock">00:00</b></div>
        <div class="prog-stat"><span class="lbl">MESAFE</span><b id="prog-dist">0</b></div>
        <div class="prog-stat end"><span class="lbl">SON DURAK</span><b id="prog-end">0:00</b></div>
      </div>
      <div class="seg-bar" id="prog-bar"></div>
    </header>
    <div class="wheel" id="wheel"></div>
    <footer class="dock">
      <button class="dock-side" id="btn-stopwatch"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5M18.5 6l1.5-1.5"/></svg><span>Kronometre</span></button>
      <button class="dock-main" id="btn-complete"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span><span id="btn-complete-text">Seti Tamamla</span></button>
      <button class="dock-side" id="btn-session"></button>
    </footer>
  </section>

  <!-- Kronometre -->
  <section id="screen-stopwatch" class="screen sw" hidden>
    <div class="sw-strip">
      <button class="round-btn" id="sw-close" aria-label="Kapat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="sw-set" id="sw-set"></div>
      <button class="round-btn" id="sw-reset" aria-label="Sıfırla"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
    </div>
    <div class="sw-display" id="sw-display">
      <div class="sw-top"><span class="sw-tag" id="sw-tag"></span><span class="sw-reps" id="sw-reps"></span></div>
      <div class="sw-dz" id="sw-dz"><div class="sw-time" id="sw-time"><span id="sw-main">0:00</span><span class="sw-tenth" id="sw-tenth">.0</span></div></div>
      <div class="sw-pbar" id="sw-pbar"><div class="f" id="sw-pfill"></div><div class="mk" id="sw-pmark"></div></div>
      <div class="sw-info">
        <div><span id="sw-diff-label">HEDEFE</span><b id="sw-diff">—</b></div>
        <div><span>ÇIKIŞA</span><b id="sw-cikis">—</b></div>
        <div><span>SON TUR</span><b id="sw-last">—</b></div>
      </div>
    </div>
    <div class="sw-ctrls">
      <div class="sw-cb"><button id="sw-startstop" aria-label="Başlat / Durdur"></button><span id="sw-ss-label">Başlat</span></div>
      <div class="sw-cb big"><button id="sw-lap">BAŞLAT</button></div>
      <div class="sw-cb"><button id="sw-save" aria-label="Kaydet"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></svg></button><span>Kaydet</span></div>
    </div>
    <!-- Kaydet paneli -->
    <div class="sheet-wrap" id="sw-sheet" hidden>
      <div class="sheet-dim" id="sw-sheet-dim"></div>
      <div class="sheet" id="sw-sheet-body"></div>
    </div>
  </section>

  <!-- Seans sonu formu -->
  <section id="screen-form" class="screen" hidden>
    <header class="topbar">
      <button class="icon-btn" id="form-back" aria-label="Programa dön">‹</button>
      <h1 class="topbar-title">Seans Sonu</h1>
    </header>
    <div class="scroll pad" id="form-scroll">
      <div class="form-grid2">
        <label class="field">
          <span>Süre (ss:dd:ss)</span>
          <input id="f-sure" type="text" inputmode="numeric" autocomplete="off" placeholder="01:24:08">
        </label>
        <label class="field">
          <span>Mesafe (m)</span>
          <input id="f-mesafe" type="number" inputmode="numeric" min="0" step="25">
        </label>
      </div>

      <div class="field">
        <span>Havuz</span>
        <div class="seg" id="f-havuz">
          <button data-v="25">25 m</button>
          <button data-v="50">50 m</button>
        </div>
      </div>

      <div class="field">
        <span>RPE</span>
        <div class="rpe-grid" id="f-rpe"></div>
      </div>

      <div class="field">
        <span>MSI <small class="muted">(isteğe bağlı — dokunulmayan bölge kaydedilmez)</small></span>
        <div class="msi" id="f-msi"></div>
      </div>

      <label class="field">
        <span>Açıklama</span>
        <textarea id="f-aciklama" rows="4" placeholder="Seans notu"></textarea>
      </label>

      <p id="form-msg" class="msg" hidden></p>
      <button class="btn btn-primary btn-xl btn-block" id="form-save">Kaydet</button>
    </div>
  </section>

  <!-- Onay -->
  <section id="screen-done" class="screen" hidden>
    <div class="done-wrap">
      <div class="done-icon" id="done-icon">✓</div>
      <h2 id="done-title">Kaydedildi</h2>
      <p id="done-text" class="muted"></p>
      <button class="btn btn-primary btn-xl btn-block" id="done-back">Gün seçimine dön</button>
    </div>
  </section>

  <!-- Diyalog -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <noscript>YüzmeSK için JavaScript gerekli.</noscript>
</body>
</html>
