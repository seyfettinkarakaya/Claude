<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
*{box-sizing:border-box}html,body{margin:0}
body{width:440px;height:956px;overflow:hidden;font-family:'Archivo',sans-serif;color:#EEF0FF;-webkit-font-smoothing:antialiased}
.phone{position:relative;width:440px;height:956px;overflow:hidden;padding:58px 20px 30px;display:flex;flex-direction:column;gap:14px;
 background:radial-gradient(420px 380px at 50% 26%,rgba(99,102,241,.22),transparent 70%),radial-gradient(300px 260px at 90% 90%,rgba(34,211,238,.10),transparent 70%),#05060B}
.n{font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:10px}
.top div{flex:1}.top small{display:block;font-size:14px;font-weight:700;color:#8087A8}.top b{font-size:24px;font-weight:800}
.ib{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.06);display:grid;place-items:center;color:#C7CBE6}
.ringw{position:relative;align-self:center;width:300px;height:300px;margin-top:4px}
.ringw svg{position:absolute;inset:0}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mid small{font-size:12px;font-weight:800;letter-spacing:2px;color:#8087A8}
.mid b{font-size:74px;font-weight:700;line-height:.95}
.mid span{font-size:20px;font-weight:700;color:#A5ABCF}
.leg{display:flex;justify-content:center;gap:20px;font-size:14px;font-weight:700;color:#A5ABCF;margin-top:-4px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.today{border-radius:30px;padding:18px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08)}
.th{display:flex;align-items:baseline;justify-content:space-between}
.th b{font-size:22px;font-weight:800}.th .n{font-size:26px;font-weight:700;color:#A5ABCF}
.zones{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin-top:14px}
.zl{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#8087A8;margin-top:6px;letter-spacing:.5px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px}
.kv small{display:block;font-size:11px;font-weight:800;letter-spacing:1.5px;color:#8087A8}.kv b{font-size:30px;font-weight:700}
.go{height:84px;border-radius:42px;background:linear-gradient(95deg,#22D3EE,#818CF8 55%,#E879F9);color:#0A0B18;display:flex;align-items:center;gap:14px;padding:0 10px 0 30px;font-size:26px;font-weight:800;box-shadow:0 16px 40px rgba(129,140,248,.35)}
.go span{flex:1}.go i{width:64px;height:64px;border-radius:50%;background:#0A0B18;color:#EEF0FF;display:grid;place-items:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{height:64px;border-radius:32px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;padding:0 18px;font-size:17px;font-weight:800;color:#C7CBE6}
.pill small{display:block;font-size:12px;font-weight:700;color:#8087A8}
.pill.dim{color:#4E5372}
</style></head><body><div class="phone">
<div class="top"><div><small>Salı · 29 Eylül</small><b>Merhaba, Seyfettin</b></div><span class="ib"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span></div>
<div class="ringw"><svg viewBox="0 0 300 300"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#818CF8"/><stop offset="1" stop-color="#E879F9"/></linearGradient><linearGradient id="g2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#A3E635"/></linearGradient></defs>
<circle cx="150" cy="150" r="132" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="22"/>

<circle cx="150" cy="150" r="102" fill="none" stroke="url(#g2)" stroke-width="18" stroke-linecap="round" stroke-dasharray="641" stroke-dashoffset="427" transform="rotate(-90 150 150)"/>
</svg><div class="mid"><small>BU HAFTA</small><b class="n">3.000</b><span class="n">/ 6.900 m</span></div></div>

<div class="zones"><i style="flex:6;background:#60A5FA"></i><i style="flex:9;background:#34D399"></i><i style="flex:8;background:#FACC15"></i><i style="flex:7;background:#FB923C"></i><i style="flex:2;background:#F87171"></i></div>
<div class="zl"><span>Z1 6′</span><span>Z2 9′</span><span>Z3 8′</span><span>Z4 7′</span><span>Z5 2′</span></div>
<div class="kv"><div><small>ANA SET</small><b class="n">800 m</b></div><div><small>HEDEF TEMPO</small><b class="n">1:58</b></div><div><small>SONRAKİ</small><b class="n">Cum</b></div></div></div>
<div class="go"><span>Yüzmeye başla</span><i><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></div>
<div class="row"><div class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Geçmiş<small>2 kayıt · 1 bekliyor</small></span></div><div class="pill dim"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg><span>Salon<small>Yakında</small></span></div></div>
