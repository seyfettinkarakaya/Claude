<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css"><style>
.phone{padding:90px 20px 34px;gap:16px;align-items:stretch}
.ring{align-self:center;width:176px;height:176px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#38BDF8,#2DD4BF,#34D399,#38BDF8);box-shadow:0 0 70px rgba(45,212,191,.35)}
.ring div{width:150px;height:150px;border-radius:50%;background:#061317;display:grid;place-items:center;color:#5EEAD4}
.dots i{position:absolute;width:10px;height:10px;border-radius:50%}
h1{margin:6px 0 0;text-align:center;font-size:40px;font-weight:800}
.d{text-align:center;font-size:18px;font-weight:700;color:#7FA3A6;margin-top:-8px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st div{border-radius:18px;padding:10px 14px;background:#0E1F24;border:1px solid #173238}.st b{display:block;font-size:34px;font-weight:700;line-height:1.05}
.ck{border-radius:24px;background:#0E1F24;border:1px solid #173238;padding:6px 16px}
.ck div{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #173238;font-size:18px;font-weight:600}
.ck div:last-child{border:0}
.ck i{width:30px;height:30px;border-radius:50%;background:rgba(52,211,153,.18);color:#34D399;display:grid;place-items:center;flex:none}
.ck small{margin-left:auto;font-family:'Barlow Condensed';font-size:19px;font-weight:700;color:#9CC0C2}
.ghost{height:64px;border-radius:22px;background:#0E1F24;border:1px solid #173238;color:#BFE3E0;font-weight:800;font-size:19px}
</style></head><body><div class="phone">
