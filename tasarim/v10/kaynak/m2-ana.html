<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
*{box-sizing:border-box}html,body{margin:0}
body{width:440px;height:956px;overflow:hidden;font-family:'Archivo',sans-serif;color:#F4F4F0;-webkit-font-smoothing:antialiased}
.phone{position:relative;width:440px;height:956px;overflow:hidden;padding:58px 22px 30px;display:flex;flex-direction:column;gap:14px;
 background:repeating-linear-gradient(90deg,transparent 0 109px,rgba(255,255,255,.035) 109px 110px),#0C0C0E}
.c{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase}
.sk{display:inline-block;transform:skewX(-9deg)}
.top{display:flex;align-items:center}
.logo{flex:1;font-size:26px;letter-spacing:1px}.logo b{color:#D4FF3A}
.gear{width:52px;height:52px;border-radius:14px;border:1.5px solid #2A2A2E;display:grid;place-items:center;color:#BDBDB8}
.kick{font-size:17px;letter-spacing:3px;color:#8A8A85;margin-top:16px}
.kick b{color:#D4FF3A}
.hero{line-height:.82;margin-top:2px}
.hero .a{font-size:62px;color:#F4F4F0}
.hero .b{font-size:150px;color:#D4FF3A;letter-spacing:-3px}
.hero .b small{font-size:60px;letter-spacing:0;margin-left:6px;color:#F4F4F0}
.meta{display:flex;gap:18px;font-size:26px;color:#F4F4F0;margin-top:4px}
.meta span{display:flex;flex-direction:column}.meta small{font-family:'Archivo';font-size:11px;font-weight:800;letter-spacing:2px;color:#8A8A85}
.meta .ms{color:#FF8A3D}
.lanes{display:flex;gap:4px;height:14px;margin-top:6px}
.lanes i{transform:skewX(-20deg)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:96px;margin-top:10px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week i{width:100%;border-radius:3px;background:#26262A;transform:skewX(-9deg)}
.week .on i{background:#D4FF3A;box-shadow:0 0 22px rgba(212,255,58,.45)}
.week .pl i{background:#F4F4F0}
.week span{font-size:14px;color:#6E6E6A;letter-spacing:1px}.week .on span{color:#D4FF3A}
.go{margin-top:auto;height:112px;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);background:#D4FF3A;color:#0C0C0E;display:flex;align-items:center;justify-content:space-between;padding:0 38px 0 40px;font-size:58px}
.go small{display:block;font-family:'Archivo';font-size:13px;font-weight:800;letter-spacing:2.5px;margin-bottom:-4px}
.gym{height:84px;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);background:#18181B;display:flex;align-items:center;justify-content:space-between;padding:0 38px 0 40px;font-size:40px;color:#4A4A48}
.gym em{font-style:normal;font-family:'Archivo';font-size:13px;font-weight:800;letter-spacing:3px;color:#6E6E6A;border:1.5px solid #3A3A3C;padding:6px 12px;transform:skewX(-9deg)}
.log{display:flex;align-items:center;justify-content:space-between;white-space:nowrap;font-size:20px;color:#BDBDB8;padding:6px 4px;border-top:1.5px solid #222226}
.log b{color:#F4F4F0}.log em{font-style:normal;font-family:'Archivo';font-size:13px;font-weight:800;color:#FFB020;letter-spacing:1px}
</style></head><body><div class="phone">
<div class="top"><div class="logo c sk">YÜZME<b>SK</b></div><div class="gear"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></div></div>
<div class="kick c">SALI · 29 EYLÜL · <b>BUGÜN HAVUZ GÜNÜ</b></div>
<div class="hero c"><div class="a sk">BUGÜN</div><div class="b sk">1.800<small>M</small></div></div>
<div class="lanes"><i style="flex:200;background:#3B82F6"></i><i style="flex:400;background:#8B5CF6"></i><i style="flex:800;background:#FF8A3D"></i><i style="flex:200;background:#FACC15"></i><i style="flex:200;background:#2DD4BF"></i></div>
<div class="meta c"><span class="sk"><small>SET</small>6</span><span class="sk"><small>HEDEF SÜRE</small>32:30</span><span class="sk ms"><small>ANA SET</small>800 M</span><span class="sk"><small>TEMPO</small>Z3</span></div>
<div class="week c">
<div><i style="height:0"></i><span>PZT</span></div><div class="on"><i style="height:62%"></i><span>SAL</span></div><div class="pl"><i style="height:42%"></i><span>ÇAR</span></div><div><i style="height:0"></i><span>PER</span></div><div class="pl"><i style="height:100%"></i><span>CUM</span></div><div><i style="height:0"></i><span>CMT</span></div><div><i style="height:0"></i><span>PAZ</span></div></div>
<div class="go c"><span class="sk"><small>İDMANA BAŞLA</small>YÜZME</span><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M4 12h15M13 5l7 7-7 7"/></svg></div>
<div class="gym c"><span class="sk">SALON</span><em>YAKINDA</em></div>
<div class="log c"><span class="sk">YAPILMIŞ İDMANLAR <b>· 2</b></span><em>1 BEKLİYOR</em></div>
</div></body></html>
