<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="file:///home/user/Claude/fonts/fonts.css"><style>
*{box-sizing:border-box;margin:0}
:root{--bg:#0B0F14;--card:#141B23;--card2:#12181F;--line:#1E2731;--text:#EDEFF2;--muted:#7A8694;--soft:#9AA5B1;--teal:#2DD4BF;--amber:#F5A524;--num:'Barlow Condensed',sans-serif}
body{width:430px;height:932px;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Archivo',sans-serif;padding:54px 20px 24px;position:relative}
svg{display:block}
.top{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-size:22px;font-weight:800;letter-spacing:.3px}
.gear{width:52px;height:52px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--soft)}
.gear svg{width:24px;height:24px}
.date{font-size:16px;font-weight:700;color:var(--muted);margin-top:14px}
.num{font-family:var(--num);font-weight:700}
.metro{width:100%;height:20px}
.hist{display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:22px;background:var(--card2);border:1px solid var(--line)}
.hist span{flex:1;display:flex;flex-direction:column}.hist b{font-size:19px}.hist small{font-size:15px;color:var(--muted);font-weight:600;margin-top:2px}
.hist svg{width:22px;height:22px;color:var(--muted)}
.ver{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:13px;color:#4C5663}

.btns{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;margin-top:16px}
.b1,.b2{height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:800;font-size:17px}
.b1 svg,.b2 svg{width:20px;height:20px}
.sw .b1{background:var(--teal);color:#032024}
.sw .b2{border:1.5px solid rgba(45,212,191,.45);color:var(--teal)}
.gy .b1{background:rgba(245,165,36,.12);color:#C98A2E;border:1.5px dashed rgba(245,165,36,.35)}
.gy .b2{border:1.5px solid rgba(245,165,36,.25);color:#9C7436}
.nx{font-size:12px;font-weight:800;letter-spacing:2px}
.sw .nx{color:var(--teal)}.gy .nx{color:#C98A2E}
.nd{font-size:24px;font-weight:800;margin-top:6px}
.nd span{color:var(--soft);font-weight:700}
.nm{font-size:22px;color:var(--soft);margin-top:4px}

.ttl{font-size:36px;font-weight:800;line-height:1.05;margin:6px 0 18px}
.card{position:relative;border-radius:28px;background:var(--card);border:1px solid var(--line);padding:18px 18px 18px 28px;overflow:hidden;margin-bottom:14px}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px}
.sw:before{background:var(--teal)}.gy:before{background:var(--amber);opacity:.6}
.hd{display:flex;align-items:center;gap:14px}
.ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.ic svg{width:30px;height:30px}
.sw .ic{background:rgba(45,212,191,.14);color:var(--teal)}
.gy .ic{background:rgba(245,165,36,.10);color:#C98A2E}
.hd h3{font-size:34px;font-weight:800;flex:1}
.gy h3{color:#9C8A70}
.soon{padding:5px 11px;border-radius:999px;border:1.5px solid rgba(245,165,36,.4);color:#C98A2E;font-size:12px;font-weight:800;letter-spacing:1.8px}
.next{margin-top:16px;padding:14px 16px;border-radius:20px;background:var(--bg);border:1px solid var(--line)}
.next .nd{font-size:22px}
.gy p{margin-top:12px;font-size:16px;color:var(--muted)}
</style></head><body><div class="top"><span class="brand">YüzmeSK</span><span class="gear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span></div><p class="date">Çarşamba, 23 Eylül</p><h1 class="ttl">Bugün ne<br>çalışıyoruz?</h1><div class="card sw"><div class="hd"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="16.5" cy="6" r="1.8"/><path d="M5 11l4-3 3 2.5 3-3"/><path d="M3 15c1.5 0 1.5 1 3 1s1.5-1 3-1 1.5 1 3 1 1.5-1 3-1 1.5 1 3 1 1.5-1 3-1"/><path d="M3 19c1.5 0 1.5 1 3 1s1.5-1 3-1 1.5 1 3 1 1.5-1 3-1 1.5 1 3 1 1.5-1 3-1"/></svg></span><h3>Yüzme</h3></div><div class="next"><span class="nx">SIRADAKİ İDMAN</span><div class="nd">Bugün <span>· Çarşamba 23 Eylül</span></div><svg class="metro" viewBox="0 0 330 20" preserveAspectRatio="none"><line x1="2" y1="10.0" x2="41" y2="10.0" stroke="#3B82F6" stroke-width="5" stroke-linecap="round"/><line x1="45" y1="10.0" x2="84" y2="10.0" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round"/><line x1="88" y1="10.0" x2="216" y2="10.0" stroke="#F97316" stroke-width="5" stroke-linecap="round"/><line x1="220" y1="10.0" x2="282" y2="10.0" stroke="#FACC15" stroke-width="5" stroke-linecap="round"/><line x1="286" y1="10.0" x2="328" y2="10.0" stroke="#2DD4BF" stroke-width="5" stroke-linecap="round"/></svg><div class="nm num">5 set · 1.200 m · 25:30 · ana set 400 m</div></div><div class="btns"><span class="b1"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>İdmanı aç</span><span class="b2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Takvim</span></div></div><div class="card gy"><div class="hd"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg></span><h3>Salon</h3><span class="soon">YAKINDA</span></div><p>Kuvvet ve mobilite programları burada olacak.</p></div><div class="hist"><span><b>Yapılmış idmanlar</b><small>12 kayıt · son: 21 Eylül</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div><div class="ver">Sürüm 10.1</div></body></html>
