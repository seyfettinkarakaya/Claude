<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="file:///home/user/Claude/fonts/fonts.css"><style>
*{box-sizing:border-box;margin:0}
:root{--bg:#0B0F14;--card:#141B23;--card2:#12181F;--line:#1E2731;--text:#EDEFF2;--muted:#7A8694;--soft:#9AA5B1;--teal:#2DD4BF;--amber:#F5A524;--num:'Barlow Condensed',sans-serif}
body{width:430px;height:932px;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Archivo',sans-serif;padding:54px 20px 24px;position:relative}
svg{display:block}
.top{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-size:22px;font-weight:800;letter-spacing:.3px}
.gear{width:52px;height:52px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--soft)}
.gear svg{width:24px;height:24px}
.date{font-size:16px;font-weight:700;color:var(--muted);margin-top:14px}
.num{font-family:var(--num);font-weight:700}
.metro{width:100%;height:20px}
.hist{display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:22px;background:var(--card2);border:1px solid var(--line)}
.hist span{flex:1;display:flex;flex-direction:column}.hist b{font-size:19px}.hist small{font-size:15px;color:var(--muted);font-weight:600;margin-top:2px}
.hist svg{width:22px;height:22px;color:var(--muted)}
.ver{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:13px;color:#4C5663}

.btns{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;margin-top:16px}
.b1,.b2{height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:800;font-size:17px}
.b1 svg,.b2 svg{width:20px;height:20px}
.sw .b1{background:var(--teal);color:#032024}
.sw .b2{border:1.5px solid rgba(45,212,191,.45);color:var(--teal)}
.gy .b1{background:rgba(245,165,36,.12);color:#C98A2E;border:1.5px dashed rgba(245,165,36,.35)}
.gy .b2{border:1.5px solid rgba(245,165,36,.25);color:#9C7436}
.nx{font-size:12px;font-weight:800;letter-spacing:2px}
.sw .nx{color:var(--teal)}.gy .nx{color:#C98A2E}
.nd{font-size:24px;font-weight:800;margin-top:6px}
.nd span{color:var(--soft);font-weight:700}
.nm{font-size:22px;color:var(--soft);margin-top:4px}

body{padding:0}
.top{position:absolute;top:54px;left:20px;right:20px;z-index:3}
.half{position:absolute;left:0;right:0;padding:0 22px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.h1{top:0;height:560px;padding-bottom:24px;background:radial-gradient(460px 320px at 85% 15%,rgba(45,212,191,.13),transparent 70%),#0D151B;border-bottom:1px solid #1B2A30}
.h2{top:560px;height:250px;padding-bottom:22px;background:radial-gradient(420px 220px at 90% 10%,rgba(245,165,36,.08),transparent 70%),#0E0D0B}
.lines{position:absolute;right:-30px;top:120px;width:320px;height:130px;opacity:.55}
.lines path{fill:none;stroke:#173238;stroke-width:2}
.k{font-size:12px;font-weight:800;letter-spacing:2.4px}
.h1 .k{color:var(--teal)}.h2 .k{color:#C98A2E}
.name{font-size:84px;font-weight:800;line-height:.95;letter-spacing:-1.5px;margin:6px 0 16px}
.h2 .name{font-size:60px;color:#6B5B44;margin-bottom:0}
.nd{font-size:22px}
.foot{position:absolute;left:20px;right:20px;top:822px}
.hist{padding:12px 18px}
.ver{display:none}
</style></head><body><div class="top"><span class="brand">YüzmeSK</span><span class="gear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span></div><div class="half h1 sw"><svg class="lines" viewBox="0 0 300 200"><path d="M0 30 q37 -22 75 0 t75 0 t75 0 t75 0"/><path d="M0 56 q37 -22 75 0 t75 0 t75 0 t75 0"/><path d="M0 82 q37 -22 75 0 t75 0 t75 0 t75 0"/><path d="M0 108 q37 -22 75 0 t75 0 t75 0 t75 0"/><path d="M0 134 q37 -22 75 0 t75 0 t75 0 t75 0"/><path d="M0 160 q37 -22 75 0 t75 0 t75 0 t75 0"/><path d="M0 186 q37 -22 75 0 t75 0 t75 0 t75 0"/></svg><span class="k">01 · YÜZME</span><span class="name">Yüzme</span><span class="nx">SIRADAKİ İDMAN</span><div class="nd">Bugün <span>· Çarşamba 23 Eylül</span></div><svg class="metro" viewBox="0 0 330 20" preserveAspectRatio="none"><line x1="2" y1="10.0" x2="41" y2="10.0" stroke="#3B82F6" stroke-width="5" stroke-linecap="round"/><line x1="45" y1="10.0" x2="84" y2="10.0" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round"/><line x1="88" y1="10.0" x2="216" y2="10.0" stroke="#F97316" stroke-width="5" stroke-linecap="round"/><line x1="220" y1="10.0" x2="282" y2="10.0" stroke="#FACC15" stroke-width="5" stroke-linecap="round"/><line x1="286" y1="10.0" x2="328" y2="10.0" stroke="#2DD4BF" stroke-width="5" stroke-linecap="round"/></svg><div class="nm num">5 set · 1.200 m · 25:30 · ana set 400 m</div><div class="btns"><span class="b1"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>İdmanı aç</span><span class="b2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Takvim</span></div></div><div class="half h2 gy"><span class="k">02 · SALON · YAKINDA</span><span class="name">Salon</span><div class="btns"><span class="b1">Yakında</span><span class="b2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Takvim</span></div></div><div class="foot"><div class="hist"><span><b>Yapılmış idmanlar</b><small>12 kayıt · son: 21 Eylül</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div></div></body></html>
