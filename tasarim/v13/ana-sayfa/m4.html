<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="file:///home/user/Claude/fonts/fonts.css"><style>
*{box-sizing:border-box;margin:0}
:root{--bg:#0B0F14;--card:#141B23;--card2:#12181F;--line:#1E2731;--text:#EDEFF2;--muted:#7A8694;--soft:#9AA5B1;--teal:#2DD4BF;--amber:#F5A524;--num:'Barlow Condensed',sans-serif}
body{width:430px;height:932px;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Archivo',sans-serif;padding:54px 20px 24px;position:relative}
svg{display:block}
.top{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-size:22px;font-weight:800;letter-spacing:.3px}
.gear{width:52px;height:52px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--soft)}
.gear svg{width:24px;height:24px}
.date{font-size:16px;font-weight:700;color:var(--muted);margin-top:14px}
.num{font-family:var(--num);font-weight:700}
.metro{width:100%;height:20px}
.hist{display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:22px;background:var(--card2);border:1px solid var(--line)}
.hist span{flex:1;display:flex;flex-direction:column}.hist b{font-size:19px}.hist small{font-size:15px;color:var(--muted);font-weight:600;margin-top:2px}
.hist svg{width:22px;height:22px;color:var(--muted)}
.ver{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:13px;color:#4C5663}

.ttl{font-size:15px;font-weight:800;letter-spacing:2.4px;color:var(--muted);margin:34px 0 8px}
.it{display:grid;grid-template-columns:54px 1fr auto;align-items:start;gap:6px;padding:26px 0;border-top:1px solid var(--line)}
.it:last-of-type{border-bottom:1px solid var(--line)}
.no{font-family:var(--num);font-size:26px;font-weight:700;color:var(--muted);padding-top:12px}
.it h3{font-size:64px;font-weight:800;line-height:1;letter-spacing:-1px}
.it .sub{display:block;margin-top:10px;font-size:22px;color:var(--soft)}
.it .k{display:block;margin-top:12px;font-size:12px;font-weight:800;letter-spacing:2px}
.sw .k{color:var(--teal)}
.sw .ic{color:var(--teal)}
.ic{width:44px;height:44px;margin-top:10px}
.gy h3{color:#4C5663}.gy .ic{color:#3A4450}.gy .k{color:var(--muted)}
.it .metro{margin-top:14px;width:250px}
.go{display:inline-flex;align-items:center;gap:8px;margin-top:16px;height:50px;padding:0 20px;border-radius:999px;background:var(--teal);color:#032024;font-weight:800;font-size:17px}
.go svg{width:20px;height:20px}
.sp{height:28px}
</style></head><body><div class="top"><span class="brand">YüzmeSK</span><span class="gear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span></div><p class="date">Çarşamba, 23 Eylül</p><p class="ttl">ANTRENMAN</p><div class="it sw"><span class="no">01</span><div><h3>Yüzme</h3><span class="k">SIRADAKİ · BUGÜN</span><svg class="metro" viewBox="0 0 250 20" preserveAspectRatio="none"><line x1="2" y1="10.0" x2="30" y2="10.0" stroke="#3B82F6" stroke-width="5" stroke-linecap="round"/><line x1="34" y1="10.0" x2="63" y2="10.0" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round"/><line x1="67" y1="10.0" x2="163" y2="10.0" stroke="#F97316" stroke-width="5" stroke-linecap="round"/><line x1="167" y1="10.0" x2="213" y2="10.0" stroke="#FACC15" stroke-width="5" stroke-linecap="round"/><line x1="217" y1="10.0" x2="248" y2="10.0" stroke="#2DD4BF" stroke-width="5" stroke-linecap="round"/></svg><span class="sub num">5 set · 1.200 m · 25:30</span><span class="go">İdmanı aç <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="16.5" cy="6" r="1.8"/><path d="M5 11l4-3 3 2.5 3-3"/><path d="M3 15c1.5 0 1.5 1 3 1s1.5-1 3-1 1.5 1 3 1 1.5-1 3-1 1.5 1 3 1 1.5-1 3-1"/><path d="M3 19c1.5 0 1.5 1 3 1s1.5-1 3-1 1.5 1 3 1 1.5-1 3-1 1.5 1 3 1 1.5-1 3-1"/></svg></span></div><div class="it gy"><span class="no">02</span><div><h3>Salon</h3><span class="k">YAKINDA</span></div><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg></span></div><div class="sp"></div><div class="hist"><span><b>Yapılmış idmanlar</b><small>12 kayıt · son: 21 Eylül</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div><div class="ver">Sürüm 10.1</div></body></html>
